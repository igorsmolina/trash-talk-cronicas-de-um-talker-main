<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trash Talker - Entrar</title>
  <link rel="icon" href="/logo-talker.svg" />
  <link rel="stylesheet" href="/css/app.css" />
  <script>
    (function () {
      var theme = localStorage.getItem("theme") || "dark";
      if (theme === "dark") document.documentElement.classList.add("dark");
    })();
  </script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1 class="auth-title">Trash Talker</h1>
      <p class="auth-subtitle">Entre na sua conta</p>

      <!-- js/login.js intercepta o envio e chama POST /api/login. -->
      <form class="auth-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="m@example.com" required />
        </div>
        <div class="field">
          <div class="field-row">
            <label for="password">Senha</label>
            <a href="/forgot-password" class="link-muted">Esqueceu a senha?</a>
          </div>
          <input id="password" name="password" type="password" required />
        </div>

        <div id="login-error" class="field-error" hidden></div>

        <button type="submit" class="btn-primary btn-block">Entrar</button>

        <p class="auth-footer-text">
          Não tem uma conta? <a href="/signup">Cadastre-se</a>
        </p>
      </form>
    </div>
    <p class="auth-legal">
      Ao continuar, você concorda com os nossos
      <a href="/terms">Termos de Uso</a> e
      <a href="/privacy">Política de Privacidade</a>.
    </p>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
